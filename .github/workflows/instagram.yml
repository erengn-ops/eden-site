name: Instagram senkronu

on:
  schedule:
    - cron: "17 */4 * * *"   # 4 saatte bir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Gönderileri çek
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: python scripts/instagram_sync.py

      - name: Değişiklik varsa commit et
        run: |
          git add data/instagram.json images/ig
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git config user.name "eden-instagram-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Instagram gönderilerini güncelle"
          git push
