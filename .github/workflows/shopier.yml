name: Shopier senkronu

on:
  schedule:
    - cron: "41 */6 * * *"   # 6 saatte bir
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - name: Ürünleri çek
        run: python scripts/shopier_sync.py

      - name: Değişiklik varsa commit et
        run: |
          git add data/shopier.json images/shop magaza/index.html index.html
          if git diff --cached --quiet; then
            echo "Değişiklik yok"
            exit 0
          fi
          git config user.name "eden-shopier-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Shopier ürünlerini güncelle"
          git pull --rebase
          git push
